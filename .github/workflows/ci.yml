name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Real PostgreSQL for packages/db/test/postgres.test.ts (node-postgres, non-owner role, RLS)
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Engine (incl. chaos suite), db (PGlite + real Postgres), shared and api tests
      - run: npm test

  image:
    name: Production image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mizan-api:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack (Postgres, migrations, API, worker)
        run: docker compose -p mizan up -d --no-build
      - name: Smoke test
        run: deploy/compose/smoke.sh mizan
      - name: Stop stack
        if: always()
        run: docker compose -p mizan down -v

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history
        run: gitleaks git . --config .gitleaks.toml --redact --exit-code 1

<title>Mizan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an operations console — fixed ink rail, porcelain workspace, one brass accent for "the scale" (what was kept). */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --surface-2:#F7F8FA; --sunk:#ECEEF1;
  --ink:#12151B; --ink-2:#4B5261; --ink-3:#848B99; --line:#E2E5EA; --line-2:#D3D7DE;
  --accent:#9C7320; --accent-ink:#7A5912; --accent-soft:#F4ECDA; --on-accent:#FFFFFF;
  --rail:#0E1116; --rail-2:#171B22; --rail-ink:#C9CDD5; --rail-dim:#6F7684; --rail-line:#232833;
  --good:#11795A; --good-soft:#E3F3EC; --warn:#A35F00; --warn-soft:#FBF0DD; --bad:#BE3328; --bad-soft:#FBE7E5; --info:#2F5FB3; --info-soft:#E6EDF9;
  --shadow:0 1px 2px rgba(16,20,28,.05),0 8px 24px -12px rgba(16,20,28,.12);
  --f-display:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D11; --surface:#13161C; --surface-2:#181C23; --sunk:#0F1217;
  --ink:#ECEEF2; --ink-2:#A8AEBA; --ink-3:#6E7583; --line:#232731; --line-2:#2E3440;
  --accent:#D6A94C; --accent-ink:#E6BE6A; --accent-soft:#2A2314; --on-accent:#1A1406;
  --rail:#08090C; --rail-2:#12151B; --rail-ink:#C9CDD5; --rail-dim:#666D7B; --rail-line:#1D212A;
  --good:#3DBD8C; --good-soft:#12261F; --warn:#E3A43B; --warn-soft:#2A2010; --bad:#F06B5F; --bad-soft:#2C1513; --info:#7EA4EE; --info-soft:#151F33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D11; --surface:#13161C; --surface-2:#181C23; --sunk:#0F1217;
  --ink:#ECEEF2; --ink-2:#A8AEBA; --ink-3:#6E7583; --line:#232731; --line-2:#2E3440;
  --accent:#D6A94C; --accent-ink:#E6BE6A; --accent-soft:#2A2314; --on-accent:#1A1406;
  --rail:#08090C; --rail-2:#12151B; --rail-ink:#C9CDD5; --rail-dim:#666D7B; --rail-line:#1D212A;
  --good:#3DBD8C; --good-soft:#12261F; --warn:#E3A43B; --warn-soft:#2A2010; --bad:#F06B5F; --bad-soft:#2C1513; --info:#7EA4EE; --info-soft:#151F33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
:lang(ar) body,html[lang="ar"] body{font-size:14.5px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:18px 12px;
  padding-inline-start:max(12px,env(safe-area-inset-left,0px));overflow-y:auto;min-height:0}
html[dir="rtl"] .rail{padding-inline-start:12px;padding-inline-end:max(12px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .mark{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.03em;color:#fff}
html[lang="ar"] .brand b{font-family:"IBM Plex Sans Arabic",var(--f-display);letter-spacing:0}
.brand small{display:block;font-size:10.5px;color:var(--rail-dim);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
html[lang="ar"] .brand small{letter-spacing:0;text-transform:none}
.store{margin:0 4px 16px;padding:10px 12px;border:1px solid var(--rail-line);border-radius:var(--r);background:var(--rail-2);display:flex;align-items:center;gap:10px;font-size:13px}
.store .av{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#C99A3E,#7A5912);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.store span{display:block;color:#fff;font-weight:600}.store em{font-style:normal;color:var(--rail-dim);font-size:11.5px}
.navlabel{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-dim);padding:14px 12px 6px}
html[lang="ar"] .navlabel{letter-spacing:0;font-size:11.5px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;margin:1px 0;border-radius:8px;color:var(--rail-ink);text-decoration:none;font-size:13.5px;position:relative}
.nav a svg{width:17px;height:17px;flex:none;opacity:.8}
.nav a:hover{background:var(--rail-2);color:#fff}
.nav a.on{background:var(--rail-2);color:#fff;font-weight:600}
.nav a.on::before{content:"";position:absolute;inset-inline-start:-12px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.nav a .ct{margin-inline-start:auto;font-family:var(--f-mono);font-size:11px;color:var(--rail-dim);background:var(--rail-line);padding:1px 7px;border-radius:20px}
.nav a .ct.hot{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-ink)}
.rail .foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--rail-line);font-size:11.5px;color:var(--rail-dim);line-height:1.5}
.rail .foot b{color:var(--rail-ink);font-weight:600}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:62px;
  padding-inline:max(24px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.iconbtn.menu-btn{display:none}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink-3);font-size:13px;cursor:text}
.search svg{width:16px;height:16px}
.search kbd{margin-inline-start:auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--ink-3)}
.top .sp{flex:1}
.demo{font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);padding:5px 10px;border-radius:20px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:9px;color:var(--ink-2)}
.iconbtn svg{width:17px;height:17px}
.me{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:600;font-size:13px}

.view{flex:1;overflow-y:auto;min-height:0}
.wrap{max-width:1360px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.vh{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.vh h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.035em;line-height:1.1;text-wrap:balance}
html[lang="ar"] .vh h1{font-family:"IBM Plex Sans Arabic",var(--f-display);letter-spacing:-.01em;font-size:28px}
.vh p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.vh .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;transition:transform .12s,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri:hover{background:color-mix(in srgb,var(--ink) 88%,var(--accent))}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.bad{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card-h h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em}
.card-h .sub{color:var(--ink-3);font-size:12.5px}
.card-h .r{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:16px 18px 18px}
.grid{display:grid;gap:16px}
.g-12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s-8{grid-column:span 8}.s-4{grid-column:span 4}.s-6{grid-column:span 6}.s-12{grid-column:span 12}.s-7{grid-column:span 7}.s-5{grid-column:span 5}.s-3{grid-column:span 3}.s-9{grid-column:span 9}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:12px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-n{background:var(--sunk);color:var(--ink-2)}.p-info{background:var(--info-soft);color:var(--info)}.p-acc{background:var(--accent-soft);color:var(--accent-ink)}
.p-ink{background:var(--ink);color:var(--bg)}
.score{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12.5px}
.score i{display:block;width:44px;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.score i b{display:block;height:100%;border-radius:3px}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:start;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
html[lang="ar"] .t th{letter-spacing:0;font-size:12px}
.t td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer;transition:background .12s}
.t tbody tr:hover{background:var(--surface-2)}
.t tbody tr.sel{background:var(--accent-soft)}
.t .end{text-align:end}
.cust b{display:block;font-weight:600}.cust span{color:var(--ink-3);font-size:12px}
.mut{color:var(--ink-3)}

/* chips/tabs */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.chip .c{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on .c{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.field{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-width:0}
.field input{border:0;background:transparent;outline:0;width:200px;max-width:100%;font-size:13px}
.field svg{width:15px;height:15px;color:var(--ink-3)}

/* overview: the scale */
.hero{padding:26px 26px 22px;position:relative;overflow:hidden}
.hero .k{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:64px;letter-spacing:-.05em;line-height:.95}
html[lang="ar"] .hero .big{letter-spacing:-.03em}
.hero .big small{font-size:22px;letter-spacing:-.02em;color:var(--ink-3);font-weight:600;margin-inline-start:8px}
.hero .delta{display:flex;flex-direction:column;gap:4px;padding-bottom:8px}
.hero .lede{font-size:15px;color:var(--ink-2);max-width:58ch;margin:14px 0 0}
.hero .lede b{color:var(--ink)}
.beam{margin-top:26px}
.beam .bar{display:flex;height:46px;border-radius:8px;overflow:hidden;gap:2px;background:var(--line)}
.beam .seg{border:0;padding:0;border-radius:0;display:block;height:100%;transition:filter .2s,flex-basis .6s cubic-bezier(.23,1,.32,1)}
.beam .seg:hover{filter:brightness(1.08)}
.beam .seg.kept{background:repeating-linear-gradient(135deg,var(--accent) 0 8px,color-mix(in srgb,var(--accent) 86%,#fff) 8px 16px)}
.legend{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-top:14px}
.legend div{font-size:12px;color:var(--ink-2);border-top:2px solid var(--c);padding-top:8px;min-width:0}
.legend div b{display:block;font-family:var(--f-mono);font-size:15px;color:var(--ink);font-weight:500;margin-top:2px}
.legend div em{font-style:normal;color:var(--ink-3);font-family:var(--f-mono);font-size:11.5px}
.fulcrum{position:absolute;inset-inline-end:26px;top:26px;width:120px;opacity:.9}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:600;letter-spacing:-.035em;margin-top:6px;line-height:1.1}
.kpi .d{font-size:12px;margin-top:4px;color:var(--ink-3)}
.up{color:var(--good)}.down{color:var(--bad)}
.spark{display:block;width:100%;height:36px;margin-top:10px}

.att{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:flex-start}
.att:first-child{border-top:0;padding-top:2px}
.att .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.att .ic svg{width:17px;height:17px}
.att b{display:block;font-weight:600;font-size:13.5px}
.att p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.att .go{margin-inline-start:auto;align-self:center}

.routes{display:flex;flex-direction:column;gap:14px}
.route .rl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.route .rl b{font-family:var(--f-mono);font-weight:500}
.route .tr{height:8px;border-radius:5px;background:var(--sunk);overflow:hidden}
.route .tr i{display:block;height:100%;border-radius:5px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:var(--surface);border-inline-start:1px solid var(--line);z-index:50;
  transform:translateX(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-inline-end:env(safe-area-inset-right,0px)}
html[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.on{transform:none!important}
.dh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:-.03em}
.db{padding:18px 22px;overflow-y:auto;flex:1}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:0;font-size:13px}
.kv span{padding:9px 0;color:var(--ink-3);border-bottom:1px solid var(--line)}
.kv b{padding:9px 0;font-weight:500;border-bottom:1px solid var(--line);min-width:0}
.why{margin-top:16px;padding:14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.why li{margin:4px 0;font-size:13px}
.why ul{margin:6px 0 0;padding-inline-start:18px}
.tl{margin-top:18px;border-inline-start:2px solid var(--line);padding-inline-start:16px}
.tl div{position:relative;padding:5px 0;font-size:12.5px;color:var(--ink-2)}
.tl div::before{content:"";position:absolute;inset-inline-start:-21px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.tl div.h::before{background:var(--accent)}
.tl div em{font-style:normal;color:var(--ink-3);font-family:var(--f-mono);font-size:11px;margin-inline-start:6px}
.df{display:flex;gap:8px;padding:16px 22px;border-top:1px solid var(--line);flex-wrap:wrap}

/* confirmation call */
.callgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px}
.qitem{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.qitem:first-child{border-top:0}
.qitem.on{background:var(--accent-soft)}
.qitem .cust{flex:1;min-width:0}
.callcard{padding:22px}
.callhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px}
.callhead h2{margin:0;font-family:var(--f-display);font-size:24px;letter-spacing:-.03em}
.callhead .ph{font-family:var(--f-mono);color:var(--ink-2);font-size:13px;direction:ltr;unicode-bidi:isolate}
.timer{margin-inline-start:auto;font-family:var(--f-mono);font-size:22px;display:flex;align-items:center;gap:10px}
.timer i{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.reasons{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.scriptbox{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scriptbox .sl{display:grid;grid-template-columns:110px minmax(0,1fr);border-top:1px solid var(--line)}
.scriptbox .sl:first-child{border-top:0}
.scriptbox .sl span{padding:12px 14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
html[lang="ar"] .scriptbox .sl span{letter-spacing:0;font-size:12px}
.scriptbox .sl p{margin:0;padding:12px 16px;font-family:"IBM Plex Sans Arabic",var(--f-body);font-size:16px;line-height:1.7;direction:rtl;text-align:right}
.scriptbox .sl.now{box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .scriptbox .sl.now{box-shadow:inset -3px 0 0 var(--accent)}
.outcomes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:18px}
.outcomes .btn{justify-content:center;height:44px}

/* automation canvas */
.builder{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:620px}
.cv-wrap{overflow:auto;border-inline-end:1px solid var(--line);background-color:var(--surface-2);
  background-image:radial-gradient(color-mix(in srgb,var(--ink-3) 35%,transparent) 1px,transparent 1px);background-size:20px 20px}
.cv{position:relative;width:820px;height:600px;margin:0 auto;direction:ltr}

/* ---------------- charts ---------------- */
function areaChart(data, w=640, h=200, color='var(--accent)'){
  const max = Math.max(...data)*1.12, min = 0, pad = {l:44, r:14, t:14, b:26};
  const X = i => pad.l + i*(w-pad.l-pad.r)/(data.length-1), Y = v => pad.t + (h-pad.t-pad.b)*(1-(v-min)/(max-min));
  const pts = data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const ticks = [0, 4000, 8000, 12000].filter(v=>v<=max);
  const last = data.length-1;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;direction:ltr" role="img" aria-label="${t('trend')}">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="${v?'3 4':''}"/><text x="${pad.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono">${v?Math.round(v/1000)+'k':'0'}</text>`).join('')}
    <polygon points="${X(0)},${Y(0)} ${pts} ${X(last)},${Y(0)}" fill="url(#ag)"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(last)}" cy="${Y(data[last])}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${X(last)-8}" y="${Y(data[last])-12}" text-anchor="end" font-size="11.5" fill="var(--ink)" font-family="IBM Plex Mono">${nf(data[last])}</text>
    ${[0,7,14,21,29].map(i=>`<text x="${X(i)}" y="${h-6}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono">${S.lang==='ar'?'':'Oct '}${(i%31)+1}${S.lang==='ar'?' أكتوبر':''}</text>`).join('')}
  </svg>`;
}
function spark(data, color){ const w=200,h=36,max=Math.max(...data),min=Math.min(...data);
  const X=i=>i*w/(data.length-1), Y=v=>4+(h-8)*(1-(v-min)/((max-min)||1));
  const p=data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="direction:ltr" aria-hidden="true"><polyline points="${p}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${X(data.length-1)}" cy="${Y(data[data.length-1])}" r="2.6" fill="${color}"/></svg>`; }

const NW = 240, NH = 84, CW = 820;
function edgePath(a, b, kind){
  const A = NODES[a], B = NODES[b];
  if (kind==='b') return `M${A.x+NW/2} ${A.y+NH} V${B.y-4}`;
  const sx = A.x+NW, sy = A.y+NH/2, ex = B.x-4, ey = B.y+NH/2;
  if (sy===ey) return `M${sx} ${sy} H${ex}`;
  const mx = sx + 20; return `M${sx} ${sy} H${mx} V${ey} H${ex}`;
}

       <g ${rtl?`transform="translate(${CW},0) scale(-1,1)"`:''} fill="none" stroke="var(--ink-3)" stroke-width="1.6">${EDGES.map(e=>`<path d="${edgePath(e[0],e[1],e[2])}" marker-end="url(#ah)"/>`).join('')}</g></svg>

      ${S.node==='c2'?`<div class="ffield"><label>${S.lang==='ar'?'مسار أيوه / لأ':'Yes / No paths'}</label><div class="in">${L(NODES.y.ti)}</div><div class="in">${L(NODES.n.ti)}</div></div>`:''}
      <div class="runlog" id="runlog"><b>${t('runs')}</b><br>${S.lang==='ar'?'1,204 تشغيل · 38% دفعوا مقدما · 0 أخطاء':'1,204 runs · 38% paid upfront · 0 errors'}</div>
    </div></div></section>
   <h3 style="margin:28px 0 12px;font-size:15px">${t('recipes')}</h3>
   <div class="recipes">${[
     [{en:'Stuck parcel',ar:'شحنة واقفة'},{en:'No courier update for 48 hours',ar:'مفيش تحديث من شركة الشحن 48 ساعة'},{en:'Open courier ticket, WhatsApp the customer, alert ops',ar:'افتح تذكرة مع الشركة، ابعت للعميل على واتساب، نبه فريق التشغيل'}],

     [{en:'Cash chase',ar:'متابعة الكاش'},{en:'Courier cash overdue 10 days',ar:'كاش متأخر عند شركة الشحن 10 أيام'},{en:'Open a claim, email the courier, notify finance',ar:'افتح مطالبة، ابعت إيميل للشركة، بلغ الحسابات'}]
   ].map(([n,w,th])=>`<button class="recipe" data-toast="toast_save"><b>${L(n)}</b><span class="w">${S.lang==='ar'?'لما':'When'}</span><p>${L(w)}</p><span class="w">${S.lang==='ar'?'ساعتها':'Then'}</span><p>${L(th)}</p></button>`).join('')}</div></div>`;
};
function runTest(){
  const path = ['t','c1','a1','w','c2','n'];
  document.querySelectorAll('.nd').forEach(n=>n.classList.add('dim'));
  path.forEach((id,i)=>setTimeout(()=>{ const el=document.querySelector(`.nd[data-n="${id}"]`); if(el){el.classList.remove('dim');el.classList.add('lit');} if(i===path.length-1){ toast(t('toast_run')); setTimeout(()=>document.querySelectorAll('.nd').forEach(n=>n.classList.remove('dim','lit')),2200);} }, 380*i));
}

  b:['أهلا يا {first_name}، معاك {agent} من {store}.','حضرتك طلبت {items} بإجمالي {total}، والدفع عند الاستلام. الطلب مظبوط كده؟','العنوان عندنا {address}. ممكن تبعتلي اللوكيشن عشان المندوب يوصلك أسرع؟','على فكرة، {upsell} بيتطلب كتير مع طلبك. تحب نضيفه بخصم {discount}؟','تمام، الطلب هيوصلك خلال {eta}، وهنبعتلك رقم الشحنة على واتساب.'], r:['أيوه مظبوط','عايز أعدل','ما طلبتش']},
 gulf:{name:{en:'Gulf',ar:'خليجي'}, v:{first_name:'فيصل',agent:'سارة',store:'سيرم بيوتي',items:'2 سيرم فيتامين سي',total:'349 ريال',address:'حي العليا',upsell:'كريم الليل',discount:'15%',eta:'يومين'},
  b:['هلا {first_name}، معك {agent} من {store}.','طلبت {items} بإجمالي {total}، والدفع عند الاستلام. الطلب صحيح كذا؟','العنوان عندنا {address}. تقدر ترسل لي اللوكيشن عشان المندوب يوصلك أسرع؟','ترى {upsell} ينطلب كثير مع طلبك. تبي نضيفه بخصم {discount}؟','تمام، طلبك بيوصلك خلال {eta}، وبنرسل لك رقم الشحنة على الواتساب.'], r:['إيه صحيح','أبي أعدل','ما طلبت']},
 lev:{name:{en:'Levantine',ar:'شامي'}, v:{first_name:'رنا',agent:'سارة',store:'سيرم بيوتي',items:'2 سيرم فيتامين سي',total:'38 دينار',address:'عبدون',upsell:'كريم الليل',discount:'15%',eta:'يومين'},
  b:['مرحبا {first_name}، معك {agent} من {store}.','طلبتي {items} بمجموع {total}، والدفع عند الاستلام. الطلب مزبوط هيك؟','العنوان عنا {address}. فيكي تبعتيلي اللوكيشن ليوصلك المندوب أسرع؟','على فكرة، {upsell} كتير بينطلب مع طلبك. بتحبي نضيفه بخصم {discount}؟','تمام، الطلب رح يوصلك خلال {eta}، ورح نبعتلك رقم الشحنة عالواتساب.'], r:['إي مزبوط','بدي غير','ما طلبت']},
 ma:{name:{en:'Darija',ar:'دارجة'}, v:{first_name:'سلمى',agent:'يوسف',store:'سيرم بيوتي',items:'2 سيروم فيتامين سي',total:'420 درهم',address:'المعاريف',upsell:'كريم الليل',discount:'15%',eta:'يومين'},
  b:['السلام {first_name}، معاك {agent} من {store}.','طلبتي {items} بمجموع {total}، والخلاص عند التوصيل. الطلب ديالك صحيح هكا؟','العنوان عندنا {address}. واش تقدري تصيفطي لينا اللوكيشن باش يوصلك الليفرور دغيا؟','على فكرة، {upsell} كيتطلب بزاف مع هاد الطلب. بغيتي نزيدوه بتخفيض {discount}؟','مزيان، الطلب غادي يوصلك فـ {eta}، وغادي نصيفطو ليك رقم الشحنة فالواتساب.'], r:['آه صحيح','بغيت نبدل','ما طلبتش']}
};
const BL = [{en:'Greeting',ar:'الترحيب'},{en:'Verify order',ar:'تأكيد الطلب'},{en:'Address and pin',ar:'العنوان واللوكيشن'},{en:'Upsell · optional',ar:'منتج إضافي · اختياري'},{en:'Close',ar:'الختام'}];
const BT = [null,{en:'Branch · 3 answers',ar:'تفرع · 3 ردود'},{en:'Asks for pin',ar:'يطلب لوكيشن'},{en:'Only if in stock',ar:'لو متوفر بس'},{en:'Outcome · confirmed',ar:'النتيجة · مؤكد'}];
const varize = s => s.replace(/\{(\w+)\}/g, (_, v) => `<span class="var">{${v}}</span>`);
const fill = (s, d) => s.replace(/\{(\w+)\}/g, (_, v) => d.v[v] ?? v);
V.scripts = () => {
  const d = DIA[S.dialect];
  if (!S.chat) S.chat = [{me:false, tx:fill(d.b[0],d)},{me:false, tx:fill(d.b[1],d)}];
  return `<div class="wrap fade">${head(t('sc_title'), t('sc_sub'), `<span class="pill p-good">${S.lang==='ar'?'شغال · تجربة A/B 50%':'Live · A/B 50%'}</span><button class="btn pri" data-toast="toast_save">${t('save')}</button>`)}
   <div class="chips" style="margin-bottom:14px">${Object.entries(DIA).map(([k,x])=>`<button class="chip ${S.dialect===k?'on':''}" data-d="${k}">${L(x.name)}</button>`).join('')}</div>
   <div class="sgrid">
    <div>
      ${d.b.map((b,i)=>`<button class="blk ${S.blk===i+1?'on':''}" data-b="${i+1}"><div class="bh"><span class="n">${i+1}</span>${L(BL[i])}${BT[i]?`<span class="tag pill ${i===4?'p-good':i===1?'p-acc':'p-n'}">${L(BT[i])}</span>`:''}</div><div class="ar">${varize(b)}</div></button>`).join('')}
      <div class="card" style="margin-top:14px;padding:16px 18px"><b style="font-size:13px">${t('branches')} · ${L(BL[1])}</b>
        <div class="kv" style="margin-top:8px"><span class="ar" style="font-family:'IBM Plex Sans Arabic'">${d.r[0]}</span><b>${S.lang==='ar'?'كمل للعنوان':'Go to address'}</b><span style="font-family:'IBM Plex Sans Arabic'">${d.r[1]}</span><b>${S.lang==='ar'?'عدل المنتجات وأكد تاني':'Edit items, verify again'}</b><span style="font-family:'IBM Plex Sans Arabic'">${d.r[2]}</span><b>${S.lang==='ar'?'إلغاء · أوردر وهمي':'Cancel · fake order'}</b><span>${S.lang==='ar'?'ما ردش':'No reply'}</span><b>${S.lang==='ar'?'إعادة بعد ساعتين':'Retry in 2 hours'}</b></div>
        <div style="display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;font-size:12.5px"><span><span class="mut">v3 ·</span> <b class="num">87%</b> <span class="mut">${t('delivered')}</span></span><span><span class="mut">v2 ·</span> <b class="num">81%</b> <span class="mut">${t('delivered')}</span></span></div></div>
      <p class="note" style="margin-top:12px">${t('dialectNote')}</p>
    </div>
    <div><div class="eyebrow" style="margin-bottom:10px">${t('preview')} · ${L(d.name)}</div>
     <div class="phone"><div class="pb"><i>SB</i><div>${S.lang==='ar'?'سيرم بيوتي':'Serum Beauty'}<div style="font-size:11px;font-weight:400;opacity:.75">WhatsApp Business</div></div></div>
       <div class="chat" id="chat">${S.chat.map(m=>`<div class="bub ${m.me?'me':''}">${m.tx}</div>`).join('')}
         ${S.chat.length===2?`<div class="qr">${d.r.map((r,i)=>`<button data-r="${i}">${r}</button>`).join('')}</div>`:''}</div></div>
     <div style="text-align:center;margin-top:10px"><button class="btn sm ghost" id="resetChat">${t('reset')}</button></div>
    </div></div></div>`;
};
function reply(i){
  const d = DIA[S.dialect];
  S.chat.push({me:true, tx:d.r[i]});
  if (i===0) S.chat.push({me:false, tx:fill(d.b[2],d)});
  else if (i===1) S.chat.push({me:false, tx: S.dialect==='gulf'?'أكيد، وش تبي تغير؟':S.dialect==='lev'?'أكيد، شو بدك تغيري؟':S.dialect==='ma'?'واخا، شنو بغيتي تبدلي؟':'أكيد، تحب تغير إيه؟'});
  else S.chat.push({me:false, tx: S.dialect==='gulf'?'آسفين على الإزعاج، ألغينا الطلب.':S.dialect==='lev'?'آسفين عالإزعاج، لغينا الطلب.':S.dialect==='ma'?'سمح لينا على الإزعاج، لغينا الطلب.':'آسفين على الإزعاج، لغينا الطلب.'});
  render();
}

/* ---------------- render + events ---------------- */
let clockT = null;
function render(){
  renderShell();
  const v = document.getElementById('view');
  v.innerHTML = (V[S.view]||V.overview)();
  if (S.view==='confirm'){ let s=0; clearInterval(clockT); clockT=setInterval(()=>{s++;const el=document.getElementById('clock'); if(!el){clearInterval(clockT);return;} el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000); }
  const oq = document.getElementById('oq'); if (oq){ oq.oninput = e => { S.q = e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById('oq'); n.focus(); n.setSelectionRange(pos,pos); }; }
  const rt = document.getElementById('runTest'); if (rt) rt.onclick = runTest;
  const rc = document.getElementById('resetChat'); if (rc) rc.onclick = () => { S.chat=null; render(); };
  const ch = document.getElementById('chat'); if (ch) ch.scrollTop = ch.scrollHeight;
}
function go(view){ S.view = view; S.chat = null; closeDrawer(); document.getElementById('rail').classList.remove('on'); document.getElementById('view').scrollTop = 0; render(); }
let tt=null; function toast(msg){ const el=document.getElementById('toast'); document.getElementById('toastT').textContent=msg; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2600); }

document.addEventListener('click', e => {
  const a = e.target.closest('[data-v]'); if (a){ e.preventDefault(); go(a.dataset.v); return; }
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  const f = e.target.closest('[data-f]'); if (f){ S.filter = f.dataset.f; render(); return; }
  const o = e.target.closest('tr[data-o]'); if (o){ openOrder(o.dataset.o); return; }
  const p = e.target.closest('tr[data-p]'); if (p){ S.pOrder = p.dataset.p; render(); return; }
  const q = e.target.closest('[data-q]'); if (q){ S.qi = +q.dataset.q; render(); return; }
  const out = e.target.closest('[data-out]'); if (out){ const m={c:'toast_conf',n:'toast_conf',r:'toast_conf',x:'toast_conf'}; toast(out.dataset.out==='c'?t('toast_conf'):(S.lang==='ar'?'اتسجلت النتيجة · التالي في الطابور':'Outcome logged · next in queue')); S.qi=(S.qi+1)%QUEUE.length; render(); return; }
  const n = e.target.closest('[data-n]'); if (n){ S.node = n.dataset.n; render(); return; }
  const d = e.target.closest('[data-d]'); if (d){ S.dialect = d.dataset.d; S.chat = null; render(); return; }
  const b = e.target.closest('[data-b]'); if (b){ S.blk = +b.dataset.b; render(); return; }
  const r = e.target.closest('[data-r]'); if (r){ reply(+r.dataset.r); return; }
  const ts = e.target.closest('[data-toast]'); if (ts){ toast(t(ts.dataset.toast)); if (ts.closest('.drawer')) closeDrawer(); return; }
  if (e.target.closest('[data-close]') || e.target.id==='scrim'){ closeDrawer(); document.getElementById('rail').classList.remove('on'); return; }
});
document.getElementById('lEn').onclick = () => { S.lang='en'; store.set('mz-lang','en'); S.chat=null; render(); };
document.getElementById('lAr').onclick = () => { S.lang='ar'; store.set('mz-lang','ar'); S.chat=null; render(); };
document.getElementById('themeBtn').onclick = () => { const d = isDark(); document.documentElement.dataset.theme = d ? 'light' : 'dark'; store.set('mz-theme', d?'light':'dark'); render(); };
document.getElementById('menuBtn').onclick = () => { document.getElementById('rail').classList.add('on'); document.getElementById('scrim').classList.add('on'); };
const th = store.get('mz-theme'); if (th) document.documentElement.dataset.theme = th;

/* command palette */
const pal = document.getElementById('pal'), palIn = document.getElementById('palIn'), palRes = document.getElementById('palRes');
function palItems(){ const q = palIn.value.toLowerCase();
  const pages = NAV.flatMap(g=>g.items.map(([k,i])=>({k:'v',id:k,label:t(k),icon:i,type:t('pages')})));
  const ords = ORDERS.map(o=>({k:'o',id:o.id,label:`<bdi>#${o.id}</bdi> · ${L(o.n)}`,icon:'orders',type:t('ord')}));
  return [...pages,...ords].filter(x=>!q || x.label.toLowerCase().includes(q)).slice(0,9); }
function palRender(){ palRes.innerHTML = palItems().map((x,i)=>`<button data-pk="${x.k}" data-pid="${x.id}" class="${i?'':'on'}">${ic(x.icon,'width="16" height="16"')}${x.label}<span>${x.type}</span></button>`).join(''); }
function palOpen(){ pal.classList.add('on'); palIn.value=''; palRender(); setTimeout(()=>palIn.focus(),10); }
function palClose(){ pal.classList.remove('on'); }
document.getElementById('searchBtn').onclick = palOpen;
palIn.oninput = palRender;
palIn.onkeydown = e => { if (e.key==='Enter'){ const f = palRes.querySelector('button'); if (f) f.click(); } if (e.key==='Escape') palClose(); };
palRes.onclick = e => { const b = e.target.closest('button'); if(!b) return; palClose(); if (b.dataset.pk==='v') go(b.dataset.pid); else { go('orders'); openOrder(b.dataset.pid); } };
pal.onclick = e => { if (e.target===pal) palClose(); };
document.addEventListener('keydown', e => { if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); palOpen(); } if (e.key==='Escape'){ palClose(); closeDrawer(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => renderShell());

const startView = (location.hash||'').slice(1); if (V[startView]) S.view = startView;
render();
</script>

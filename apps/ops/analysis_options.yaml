include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated: drift code, and the design system's tokens copied from packages/design-system/dist.
    - "**/*.g.dart"
    - lib/theme/mizan_tokens.dart
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print

# gitleaks config — default rules plus a narrow allowlist.
# Fake provider servers in tests use dummy credentials by design; real secrets
# never live in the repo (CLAUDE.md rule 10).
title = "mizan gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Dummy credentials in fake provider servers; the Shopify app's public Client ID"
paths = ['''^packages/[^/]+/test/fakes/''']
# SHOPIFY_API_KEY is the app's Client ID: public by design (Shopify puts it in every install URL).
# Only that line shape is allowed; the client secret (shpss_…) and access tokens (shpat_…) stay
# flagged and live in Key Vault (shopify-api-secret), never in the repo.
regexTarget = "line"
regexes = ['''^\s*SHOPIFY_API_KEY\s*=\s*"[0-9a-f]{32}"''']
